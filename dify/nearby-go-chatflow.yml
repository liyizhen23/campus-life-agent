      zIndex: 0
    - data:
        desc: 提取地点、预算、时间、同行人、体验偏好与显式避雷项
        instruction: '你是附近探索需求分析器。只提取用户当前消息明确表达或可确定换算的条件，不得把常识猜测成用户偏好。

          categories 只能优先使用：美食、餐厅、咖啡、购物、娱乐、电影、景点、公园。

          “吃饭加游玩”“餐饮+景点”等复合需求必须同时提取餐饮类和游玩类，不能只保留餐饮类。

          keywords 只放店名、菜系、具体活动或地点类型；preferences 放正向软偏好，例如安静、亲子、适合拍照、室内。

          avoid_terms 只放用户明确说不要、避开、过敏、不能接受的词，不得混入正向 preferences。尽量归一为可匹配的原子关键词，例如“不要太辣”提取“辣”，“花生过敏”提取“花生”。

          companion_profile 提取情侣、独自、朋友、亲子、老人、宠物等同行画像；dietary_needs 提取素食、清真、过敏原、忌口等；accessibility_needs 提取少走路、轮椅、婴儿车等可达性要求；ambience 提取安静、热闹、浪漫、适合聊天、适合拍照等氛围。

          decision_priority 只能是 balanced、nearest、rating、budget、experience 之一；未明确时为 balanced。plan_mode 只能是 quick_pick、compare、itinerary、multi_day 之一：只问推荐用 quick_pick，要求对比用 compare，路线/安排用 itinerary，多日用 multi_day。

          transport 只能是 walking 或 driving；步行、散步用 walking，自驾、开车、打车用 driving，未明确时用 walking。公交、骑行等后端暂不支持时仍填 walking，并把原始要求放入 special_notes。

          radius_meters 根据“步行多少分钟”等表述合理换算，未明确时留空。

          duration_minutes 提取用户可用总时长，例如“三小时”为 180。

          duration_days 提取行程天数，例如“三天两夜”为 3；未明确时为 1。

          “半天”按 240 分钟，“一天/全天”按 480 分钟；“每天 8 小时”的多日请求，duration_minutes 填每天分钟数乘天数。

          party_size 是明确同行总人数。若用户只给总预算且人数明确，budget_per_person 应换算成人均；不确定时不要换算。

          多日游玩攻略默认需要兼顾餐饮和游玩，不得只提取一个大类。

          start_time 只提取用户明确给出的开始时间文本。special_notes 保留无法映射但会影响决策的重要要求，最多 5 项。

          不要猜测用户没有表达的预算、同行人、可达性或偏好。

          '
