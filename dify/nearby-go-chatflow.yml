  conversation_variables: []
  environment_variables:
  - description: 公网可访问的后端地址，例如 https://guide.example.com
    id: backend-base-url
    name: BACKEND_BASE_URL
    selector:
    - env
    - BACKEND_BASE_URL
    value: https://nearby-go.onrender.com
    value_type: string
  - description: 与后端 INTERNAL_API_TOKEN 完全一致
    id: internal-api-token
    name: INTERNAL_API_TOKEN
    selector:
    - env
    - INTERNAL_API_TOKEN
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |-
      你好，我是 **NearbyGo 附近灵感向导** 🧭

      告诉我你想吃什么、玩什么，或直接说可用时间、预算、同行人和氛围偏好。我会基于你本次定位与可核实的高德地点/路线数据，给出主选、备选或可执行行程。

      定位只用于本次附近检索；营业时间、门票、排队与现场活动仍建议出发前核实。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 推荐附近人均 80 元、安静适合聊天的晚餐
    - 帮我安排一个吃饭加散步的 3 小时路线
    - 带孩子和老人，附近有什么轻松不折腾的去处？
    - 做一份两天一夜、每天约 8 小时的周边攻略
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
